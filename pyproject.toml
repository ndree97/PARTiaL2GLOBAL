[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partial2global"
version = "1.0.0"
description = "Lightweight Partial-to-Global Point Cloud Registration Suite with Metrology QC, CLI & Modern PyQt5 GUI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PARTiaL2GLOBAL Contributors"}
]
keywords = [
    "point-cloud",
    "registration",
    "icp",
    "fgr",
    "ransac",
    "partial-to-global",
    "open3d",
    "las",
    "laz",
    "e57",
    "pyvista",
    "pyqt5",
    "metrology"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent"
]
dependencies = [
    "numpy>=1.23.0",
    "open3d>=0.17.0",
    "laspy[lazrs]>=2.5.0",
    "pye57>=0.4.1",
    "scipy>=1.10.0",
    "pyvista>=0.40.0",
    "PyQt5>=5.15.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0"
]

[project.scripts]
partial2global = "cli:main"
partial2global-gui = "main:main"
p2g = "cli:main"
p2g-gui = "main:main"

[project.urls]
Homepage = "https://github.com/ndree97/PARTiaL2GLOBAL"
Repository = "https://github.com/ndree97/PARTiaL2GLOBAL.git"
Issues = "https://github.com/ndree97/PARTiaL2GLOBAL/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["partial2global*"]
